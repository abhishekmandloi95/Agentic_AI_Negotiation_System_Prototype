[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    ragheavy: FAISS tests with deterministic embeddings
    forecast: fits a real Prophet model
    ganache: requires a running local Ganache
    blockchain: in-memory EVM tests, no live blockchain
    llm: requires a running Ollama model
    embeddings: loads a real sentence-transformer model
    ui: Streamlit application tests
